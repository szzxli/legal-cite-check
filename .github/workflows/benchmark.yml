name: benchmark
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # benchmark/run.py runs live only if COURTLISTENER_TOKEN is set;
      # otherwise it runs the labelled-mock replay and says so.
      - run: python benchmark/run.py --mode auto --out benchmark/results/latest.json
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
      - run: python benchmark/score.py benchmark/results/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark/results/
