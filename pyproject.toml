[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalcite"
version = "0.1.0"
description = "Check whether a cited case exists in CourtListener and whether the case name matches. Not legal advice."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
rapidfuzz = ["rapidfuzz>=3.0"]
eyecite = ["eyecite>=2.7"]
dev = ["pytest>=8"]

[project.scripts]
legalcite = "legalcite.__main__:main"

[tool.setuptools.packages.find]
include = ["legalcite*"]
